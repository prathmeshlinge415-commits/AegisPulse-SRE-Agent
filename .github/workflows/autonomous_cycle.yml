name: AegisPulse Autonomous SRE Watch

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autonomous-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run autonomous multi-agent SRE cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python autonomous_runner.py

      - name: Persist model memory state
        run: |
          git config user.name "AegisPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/incident_memory.json
          git diff --staged --quiet || git commit -m "chore(memory): autonomous SRE baseline update"
          git push
